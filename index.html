<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Preços</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;padding:20px}
.container{max-width:720px;margin:0 auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#666;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:600;color:#333}
select,input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:14px;background:#fff}
select:focus,input:focus{outline:2px solid #4f46e5;border-color:#4f46e5}
.modo{display:flex;gap:10px}
.modo button{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;background:#f8f9fa;cursor:pointer;font-size:14px;font-weight:600}
.modo button.ativo{background:#4f46e5;color:#fff;border-color:#4f46e5}
.resultados{margin-top:22px}
.resultado{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:10px;margin-bottom:10px;background:#f8f9fa;border:1px solid #e5e7eb}
.resultado .nome{font-weight:600;font-size:14px}
.resultado .valor{font-size:20px;font-weight:700;color:#4f46e5}
.resultado .detalhe{font-size:12px;color:#888;margin-top:2px}
.nota{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 14px;border-radius:8px;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="container">
<h1>Calculadora de Preços</h1>
<div class="sub">Mercado Livre — Clássico e Premium</div>
<div class="grid">
  <div class="field full">
    <label>CNPJ / Alíquota</label>
    <select id="cnpj"></select>
  </div>
  <div class="field">
    <label>Peso do produto</label>
    <select id="peso"></select>
  </div>
  <div class="field">
    <label>Nível</label>
    <select id="nivel">
      <option value="1">Nível 1</option>
      <option value="2">Nível 2</option>
      <option value="3" selected>Nível 3</option>
      <option value="4">Nível 4</option>
      <option value="5">Nível 5</option>
    </select>
  </div>
  <div class="field">
    <label>Custo do produto (R$)</label>
    <input type="number" id="custo" value="10" step="0.01">
  </div>
  <div class="field full">
    <label>Modo de cálculo</label>
    <div class="modo">
      <button id="btnManual" class="ativo" onclick="setModo('manual')">Preço informado</button>
      <button id="btnLiquido" onclick="setModo('liquido')">Valor líquido desejado</button>
    </div>
  </div>
  <div class="field full">
    <label id="lblEntrada">Preço de venda (R$)</label>
    <input type="number" id="entrada" value="100" step="0.01">
  </div>
</div>
<div class="resultados">
  <div class="resultado">
    <div><div class="nome">Mercado Livre Clássico</div><div class="detalhe" id="detMLC"></div></div>
    <div class="valor" id="valMLC">—</div>
  </div>
  <div class="resultado">
    <div><div class="nome">Mercado Livre Premium</div><div class="detalhe" id="detMLP"></div></div>
    <div class="valor" id="valMLP">—</div>
  </div>
</div>
<div class="nota" id="nota"></div>
</div>
<script>
const CONFIG = {
  aliquota: {
    "EME": 0.10,
    "LOJA DA VIVI LTDA": 0.10,
    "FERREIRA PROSPERITA": 0.11,
    "RAV SHEFA": 0.10,
    "VIVIANE CHRISTINA FERREIRA": 0.04
  },
  niveis: { 1: 1, 2: 1, 3: 0.6, 4: 0.5, 5: 0.5 },
  insumoPorPeso: 1, // R$1 até 300g, R$2 acima (pesoIdx 0 = até 0,3kg)
  mercadoLivre: {
    comissao: { classico: 0.14, premium: 0.19 },
    taxaML: function(preco){
      if(preco < 12.50) return preco * 0.50;
      if(preco < 29.00) return 6.25;
      if(preco < 50.00) return 6.50;
      if(preco <= 78.99) return 6.75;
      return 0;
    },
    freteAntigo: [40.9, 41.9, 43.9, 46.9, 51.9, 83.9, 131.9, 146.9, 171.9, 197.9],
    freteAntigoPorPeso: [0,1,2,3,3,4,5,5,6,6,6,6,6,7,7,7,8,8,9,9,9,9,9,9,9,9,9,9,9,9],
    freteNovo: [
      [5.65,6.85,8.15,12.95,14.95,16.95,19.05,21.65],
      [5.95,6.95,8.25,13.85,16.15,18.15,20.45,23.25],
      [6.05,7.15,8.45,14.45,16.85,19.05,21.35,24.45],
      [6.15,7.35,8.65,14.75,17.15,19.45,21.75,25.45],
      [6.25,7.45,8.75,15.05,17.65,19.85,22.25,25.55],
      [6.35,8.65,9.15,16.45,19.15,21.65,24.35,27.05],
      [6.45,8.75,9.75,17.85,20.75,23.35,26.35,29.25],
      [6.55,8.85,10.25,19.75,22.85,26.05,29.25,32.45],
      [6.65,8.95,10.35,25.95,29.15,33.35,36.45,40.85],
      [6.75,9.05,10.45,27.55,31.65,36.75,40.85,45.25],
      [6.85,9.25,10.55,29.45,34.35,39.25,44.15,49.35],
      [6.95,9.35,10.65,30.25,35.25,40.35,45.35,50.75],
      [7.05,9.45,10.85,38.25,45.05,51.95,58.75,65.85],
      [7.05,9.65,11.05,41.65,48.55,55.45,62.35,69.35],
      [7.15,10.05,11.45,42.55,49.75,56.85,63.85,70.95],
      [7.25,10.25,11.65,45.55,52.95,60.55,68.15,75.65],
      [7.35,10.45,11.85,48.95,56.55,64.05,71.35,79.35],
      [7.45,10.65,12.05,55.15,64.35,73.55,82.75,91.95],
      [7.65,11.05,12.25,64.55,75.75,85.45,96.25,106.85],
      [7.75,11.25,12.45,66.45,76.05,86.25,97.15,107.85],
      [7.85,11.45,12.65,68.35,79.65,89.75,100.05,107.95],
      [7.95,11.65,12.85,70.95,81.85,92.85,103.45,111.65],
      [8.05,11.85,13.05,75.55,87.25,99.05,110.25,119.05],
      [8.15,12.05,13.25,80.95,93.75,105.95,118.05,127.45],
      [8.25,12.25,13.45,84.65,97.95,110.75,123.35,133.15],
      [8.35,12.45,13.65,94.05,108.35,122.95,136.95,147.85],
      [8.45,12.65,13.85,107.45,124.85,140.45,156.45,168.85],
      [8.55,12.85,14.05,120.15,138.95,156.95,174.85,188.85],
      [8.65,12.85,14.25,127.45,147.05,166.55,185.55,200.35],
      [8.75,12.85,14.45,167.05,193.35,218.45,243.45,262.85]
    ]
  }
};
const PESOS = ["Até 0,3 kg","0,3 a 0,5 kg","0,5 a 1 kg","1 a 1,5 kg","1,5 a 2 kg","2 a 3 kg","3 a 4 kg","4 a 5 kg","5 a 6 kg","6 a 7 kg","7 a 8 kg","8 a 9 kg","9 a 10 kg","10 a 11 kg","11 a 13 kg","13 a 15 kg","15 a 17 kg","17 a 20 kg","20 a 25 kg","25 a 30 kg","30 a 40 kg","40 a 50 kg","50 a 60 kg","60 a 70 kg","70 a 80 kg","80 a 90 kg","90 a 100 kg","100 a 125 kg","125 a 150 kg","Mais de 150 kg"];
let modo='manual';
function getInsumo(pesoIdx){return pesoIdx===0?1:2;}
function setModo(m){modo=m;document.getElementById('btnManual').classList.toggle('ativo',m==='manual');document.getElementById('btnLiquido').classList.toggle('ativo',m==='liquido');document.getElementById('lblEntrada').textContent=m==='manual'?'Preço de venda (R$)':'Valor líquido desejado (R$)';calcular();}
function init(){
  const cnpj=document.getElementById('cnpj');
  Object.keys(CONFIG.aliquota).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n+' ('+(CONFIG.aliquota[n]*100).toFixed(0)+'%)';cnpj.appendChild(o);});
  const peso=document.getElementById('peso');
  PESOS.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p;peso.appendChild(o);});
  ['custo','entrada','peso','nivel','cnpj'].forEach(id=>{document.getElementById(id).addEventListener('input',calcular);document.getElementById(id).addEventListener('change',calcular);});
  calcular();
}
function getFrete(preco,nivel,pesoIdx){
  const f=CONFIG.niveis[nivel];
  if(nivel<=2){
    if(preco<=78.99)return 0;
    return CONFIG.mercadoLivre.freteAntigo[CONFIG.mercadoLivre.freteAntigoPorPeso[pesoIdx]]*f;
  }else{
    let col;
    if(preco<19)col=0;else if(preco<49)col=1;else if(preco<=78.99)col=2;else if(preco<100)col=3;else if(preco<120)col=4;else if(preco<150)col=5;else if(preco<200)col=6;else col=7;
    let frete=CONFIG.mercadoLivre.freteNovo[pesoIdx][col];
    if(preco<19)frete=Math.min(frete,preco*0.5);
    return frete*f;
  }
}
function calcPlano(preco,plano){
  const custo=parseFloat(document.getElementById('custo').value)||0;
  const nivel=parseInt(document.getElementById('nivel').value);
  const pesoIdx=parseInt(document.getElementById('peso').value);
  const insumo=getInsumo(pesoIdx);
  const aliquota=CONFIG.aliquota[document.getElementById('cnpj').value]||0;
  const comissao=CONFIG.mercadoLivre.comissao[plano];
  const taxa=CONFIG.mercadoLivre.taxaML(preco);
  const frete=getFrete(preco,nivel,pesoIdx);
  const liquido=preco-(custo+insumo)-preco*comissao-preco*aliquota-taxa-frete;
  return {liquido,comissao,taxa,frete,insumo};
}
function calcPrecoAlvo(lucro,plano){
  const custo=parseFloat(document.getElementById('custo').value)||0;
  const nivel=parseInt(document.getElementById('nivel').value);
  const pesoIdx=parseInt(document.getElementById('peso').value);
  const insumo=getInsumo(pesoIdx);
  const aliquota=CONFIG.aliquota[document.getElementById('cnpj').value]||0;
  const comissao=CONFIG.mercadoLivre.comissao[plano];
  let preco=lucro+custo+insumo;
  for(let i=0;i<100;i++){
    const taxa=CONFIG.mercadoLivre.taxaML(preco);
    const frete=getFrete(preco,nivel,pesoIdx);
    const novo=(lucro+custo+insumo+taxa+frete)/(1-comissao-aliquota);
    if(Math.abs(novo-preco)<0.0001)break;
    preco=novo;
  }
  return preco;
}
function calcular(){
  const entrada=parseFloat(document.getElementById('entrada').value)||0;
  const nivel=parseInt(document.getElementById('nivel').value);
  const pesoIdx=parseInt(document.getElementById('peso').value);
  const pesoLabel=PESOS[pesoIdx];
  const insumo=getInsumo(pesoIdx);
  const tabela=nivel<=2?'tabela antiga':'tabela nova (peso × valor)';
  if(modo==='manual'){
    const c=calcPlano(entrada,'classico'),p=calcPlano(entrada,'premium');
    document.getElementById('valMLC').textContent='R$ '+c.liquido.toFixed(2);
    document.getElementById('valMLP').textContent='R$ '+p.liquido.toFixed(2);
    document.getElementById('detMLC').textContent='comissão '+(c.comissao*100).toFixed(0)+'% · taxa R$'+c.taxa.toFixed(2)+' · frete R$'+c.frete.toFixed(2)+' · insumo R$'+c.insumo.toFixed(2);
    document.getElementById('detMLP').textContent='comissão '+(p.comissao*100).toFixed(0)+'% · taxa R$'+p.taxa.toFixed(2)+' · frete R$'+p.frete.toFixed(2)+' · insumo R$'+p.insumo.toFixed(2);
  }else{
    const c=calcPrecoAlvo(entrada,'classico'),p=calcPrecoAlvo(entrada,'premium');
    document.getElementById('valMLC').textContent='R$ '+c.toFixed(2);
    document.getElementById('valMLP').textContent='R$ '+p.toFixed(2);
    document.getElementById('detMLC').textContent='preço sugerido para líquido R$'+entrada.toFixed(2);
    document.getElementById('detMLP').textContent='preço sugerido para líquido R$'+entrada.toFixed(2);
  }
  document.getElementById('nota').textContent='Nível '+nivel+' · '+pesoLabel+' · insumo R$'+insumo.toFixed(2)+' · '+tabela;
}
init();
</script>
</body>
</html>
